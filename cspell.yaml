$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: "0.2"
languageSettings:
  - languageId: html,css,md,mdx,astro,js,ts
    dictionaries:
      - html
      - html-symbols
      - css
      - mdx
      - astro
      - javascript
      - typescript
      - markdown
      - python
    include:
      - "src/**/*.css"
ignoreRegExpList:
  - '"[a-z]{4}"'
