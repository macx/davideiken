$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: "0.2"
language: en,de
import:
  - "@cspell/dict-de-de/cspell-ext.json"
useGitignore: true
ignorePaths:
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - "**/*.svg"
  - "src/assets/**"
  - "public/sounds/**"
  - LICENSE
languageSettings:
  # The German dictionary enables case-sensitive checking for "de";
  # project words and file names (rossmann.svg) are matched case-insensitively.
  - languageId: "*"
    locale: "*"
    caseSensitive: false
  - languageId: html,css,md,mdx,astro,js,ts
    dictionaries:
      - html
      - html-symbols
      - css
      - mdx
      - astro
      - javascript
      - typescript
      - markdown
ignoreRegExpList:
  - '"[a-z]{4}"'
  - "&[a-z]+;"
# Project-specific names, brands, technical terms and German compounds.
# Keep alphabetical (case-insensitive).
words:
  - aekn
  - Ahlers
  - Anfrageformular
  - badbot
  - bertelsmann
