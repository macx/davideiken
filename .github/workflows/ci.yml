name: CI

on:
  push:
    branches: ["develop"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build:
    name: Build and Test
    if: |
      github.event_name != 'push' ||
      github.ref != 'refs/heads/develop' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run TypeScript Check
        run: pnpm astro check

      - name: Build
        run: pnpm astro build

      - name: Run Tests
        run: pnpm test

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dist
          path: dist/
          retention-days: 7

  release:
    name: Create GitHub Release and Deploy to Plesk
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Merge release tag into main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:main
          git checkout main
          git merge ${{ github.ref_name }} --no-ff -m "chore(release): merge ${{ github.ref_name }} into main"
          git push origin main

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create Release Zip
        run: zip -r dist.zip dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- NEW: build production node_modules for the server runtime ---
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install production dependencies for deployment
        run: pnpm install --prod --no-frozen-lockfile
      # --- END NEW ---

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_KEY }}
          known_hosts: "placeholder"
          if_key_exists: replace

      - name: Adding Known Hosts
        run: ssh-keyscan -p ${{ secrets.DEPLOY_PORT || 22 }} -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy app with Rsync
        run: |
          rsync -azP --delete -e "ssh -p ${{ secrets.DEPLOY_PORT || 22 }}" dist/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}

      - name: Deploy node_modules with Rsync
        run: |
          rsync -azP --delete -e "ssh -p ${{ secrets.DEPLOY_PORT || 22 }}" node_modules/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}node_modules/

      - name: Restart Node Application via Phusion Passenger
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT || 22 }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "mkdir -p ${{ secrets.DEPLOY_PATH }}tmp && touch ${{ secrets.DEPLOY_PATH }}tmp/restart.txt"
