name: CI

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Enable Corepack
      run: corepack enable

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install

    - name: Get Playwright version
      run: echo "PLAYWRIGHT_VERSION=$(pnpm exec playwright --version | cut -d' ' -f2)" >> $GITHUB_ENV

    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright Browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: pnpm exec playwright install chromium

    - name: Install Playwright system dependencies
      run: pnpm exec playwright install-deps chromium

    - name: Run TypeScript Check
      run: pnpm astro check

    - name: Build
      run: pnpm astro build

    - name: Run Playwright Tests
      run: pnpm test

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: dist
        path: dist/
        retention-days: 7

  release:
    name: Create GitHub Release and Deploy to Plesk
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist

    - name: Create Release Zip
      run: zip -r dist.zip dist

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install SSH Key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.DEPLOY_KEY }}
        known_hosts: "placeholder"
        if_key_exists: replace

    - name: Adding Known Hosts
      run: ssh-keyscan -p ${{ secrets.DEPLOY_PORT || 22 }} -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy with Rsync
      run: |
        rsync -azP --delete -e "ssh -p ${{ secrets.DEPLOY_PORT || 22 }}" dist/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}

    - name: Restart Node Application via Phusion Passenger
      run: |
        ssh -p ${{ secrets.DEPLOY_PORT || 22 }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "mkdir -p ${{ secrets.DEPLOY_PATH }}tmp && touch ${{ secrets.DEPLOY_PATH }}tmp/restart.txt"
